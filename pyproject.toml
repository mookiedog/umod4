[project]
name = "umod4"
version = "0"
description = "Python environment for the umod4 build, log decoder, visualizer, server and test harness"
# This is a tools repository, not a library: nobody installs it as a dependency, so it pins the one
# Python version it is developed and tested on, instead of promising compatibility with others.
# A narrow pin also keeps uv.lock small (the lock file records the wheels for every Python allowed).
# To move to a newer Python: change this line, run 'uv lock', then rebuild everything and run the
# test suite.
requires-python = "==3.12.*"
dependencies = []

# Each group is what one consumer needs. Developers get every group (see default-groups below);
# a release bundle installs only the group it needs, for example: uv run --only-group viz ...
[dependency-groups]
build  = ["pymongo", "mmh3"]
decode = ["numpy", "h5py", "PyYAML"]
viz    = [{ include-group = "decode" }, "PySide6-Essentials", "pyqtgraph", "pandas"]
server = ["PySide6-Essentials", "flask", "sqlalchemy", "requests"]
test   = ["pyserial", "requests"]

[tool.uv]
# This project is a set of scripts, not an installable package.
package = false
default-groups = "all"
